<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title> Coming soon! </title>

<style>
:root{
    --bg:#0f1115;
    --text:#e6e8eb;
    --dim:#8b919a;
    --accent:#7aa2f7;
    --line:#292d35;
    --mono:Consolas,"Courier New",monospace;
}

*{box-sizing:border-box}

body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
}

header,main,footer{
    max-width:820px;
    margin:auto;
}

header{padding:48px 24px 24px}

h1{
    margin:0 0 6px;
    color:#00AFF0;
    font:700 30px var(--mono);
}

.tagline{
    margin:0;
    color:var(--dim);
    font-size:14px;
}

nav{
    position:sticky;
    top:0;
    z-index:1;
    background:rgba(15,17,21,.92);
    backdrop-filter:blur(6px);
    border-bottom:1px solid var(--line);
}

nav ul{
    display:flex;
    gap:6px;
    max-width:820px;
    margin:auto;
    padding:10px 24px;
    overflow:auto;
    list-style:none;
}

nav a{
    display:block;
    padding:6px 11px;
    border:1px solid var(--line);
    border-radius:4px;
    color:var(--dim);
    font:13px var(--mono);
    text-decoration:none;
    white-space:nowrap;
}

nav a:hover{
    color:var(--text);
    border-color:#3a404b;
}

main{padding:56px 24px}

h2{
    margin:0 0 24px;
    color:var(--accent);
    font:12px var(--mono);
    letter-spacing:.1em;
    text-transform:uppercase;
}

p{margin:0 0 18px}
p:last-of-type{margin-bottom:0}
strong{color:var(--text)}
em{color:var(--dim);font-style:normal}

footer{
    padding:32px 24px 48px;
    color:var(--dim);
    font-size:12px;
}

.footer-grid{
    display:flex;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:8px 18px;
}

.footer-line{
    height:1px;
    margin:14px 0;
    background:var(--line);
}

@media(max-width:600px){
    header{padding-top:36px}
    h1{font-size:24px}
    main{padding:40px 18px}
    footer{padding:28px 18px 36px}
}
</style>
</head>

<body>

<header>
    <h1> Isotope </h1>
    <p class="tagline"> Mahyar's Laboratory </p>
</header>

<nav>
    <ul>
        <li><a href="https://mahyar132.github.io/">Home</a></li>
        <li><a href="https://mahyar132.github.io/about/">About</a></li>
        <li><a href="https://mahyar132.github.io/projects/">Projects</a></li>
        <li><a href="https://mahyar132.github.io/contact/">Contact</a></li>
        <li><a href="https://mahyar132.github.io/art/">Art</a></li>
    </ul>
</nav>

<main>
    <h2> About </h2>

    <img src="CNSTRCT2.GIF">

    <p> This page is still under construction. </p>
    <p> I'm working on something. you'll see. </p>

        <em> Mahyar, Powered by Caffeine </em>

    </p>
</main>

<footer>
    <div class="footer-grid">
        <span> Mahyar </span>
        <span> Under Construction </span>
    </div>

    <div class="footer-line"></div>

    Copyright © 2026 - <span id="year"></span> Mahyar Projects
</footer>

<script>
document.getElementById("year").textContent=new Date().getFullYear();
</script>

</body>
</html>
